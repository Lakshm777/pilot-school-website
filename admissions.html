<!DOCTYPE html>
<html>
<head>
    <title>About - ABC School</title>
    <!-- Bootstrap first, then custom CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>ABC School</h2>
        <a href="index.html">Home</a>
        <a href="about-us.html">About</a>
        <a href="academics.html">Academics</a>
        <a href="admissions.html">Admissions</a>
        <a href="facilities.html">Facilities</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Admissions Page Content -->
    <section class="container py-5 mt-4 text-center">
        <h1 class="text-success mb-4">Admissions</h1>
        <form id="admissionForm" class="mt-4 text-start mx-auto" style="max-width: 600px;">
    
            <!-- Student Name Field -->
            <div class="mb-3">
                <label for="studentName" class="form-label">Student Full Name</label>
                <input type="text" class="form-control" id="studentName" placeholder="Enter full name" required>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
                <label for="studentEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="studentEmail" placeholder="name@example.com" required>
            </div>

            <!-- Date of Birth Field -->
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" required>
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success btn-lg">Submit Application</button>
            </div>
        </form>
    </section>



    <script src="js/script.js"></script>
</body>
</html>
